      - libwayland-client0
      - libwayland-server0
      - libwayland-cursor0
      - libwayland-dev
      - libwayland-egl1
      - libwayland-egl-backend-dev
      - libwayland-bin
      - libwayland-doc
      - wayland-protocols

    # Intel Kernel & Tools
    # Remove these to disable: Intel-optimized 6.18 kernel with headers and tools
      - linux-headers-6.18-intel
      - linux-image-6.18-intel
      #- linux-kbuild
      #- linux-misc-tools
      #- linux-cpupower
      #- linux-config-6.18
      - linux-bpf-dev
      - linux-bpftool-6.18-intel
      - linux-intel-pstate-tracer-6.18-intel
      - linux-perf-6.18-intel
      - linux-power-tools-6.18-intel
      - linux-rtla-6.18-intel
      - linux-usbip-6.18-intel
      #- libcpupower-dev
      #- libcpupower1

    # Boot Configuration Utilities
    # Remove these to disable: bootconfig inspection and generation tooling
      #TODO- bootconfig


    # Intel NPU driver dependency
    # The NPU driver (installed later from GitHub in the configurations section)
