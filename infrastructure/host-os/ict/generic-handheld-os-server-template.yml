image:
  name: minimal-ubuntu-server
  version: "24.04"

target:
  os: ubuntu
  dist: ubuntu24
  arch: x86_64
  imageType: raw

# Disk layout and output artifact definition
disk:
  name: minimal-ubuntu-server
  artifacts:
    - type: raw
      compression: gz
  size: 32GiB
  # TODO optimise size
  partitionTableType: gpt
  partitions:
    # EFI system partition
    - id: EFI
      name: EFI
      type: esp
      typeUUID: c12a7328-f81f-11d2-ba4b-00a0c93ec93b
      fsType: vfat
      fsLabel: UEFI
      start: 1MiB
      end: 1025MiB
      mountPoint: /boot/efi
      mountOptions: defaults
      flags:
        - boot
        - esp
    # Swap partition
    - id: SWAP
      name: SWAP
      type: linux-swap
      typeUUID: 0657fd6d-a4ab-43c4-84e5-0933c84b4f4f
      fsType: linux-swap
      start: 1025MiB
      end: 5073MiB
      mountPoint: none
      mountOptions: sw
      flags: []
    # Root filesystem
    - id: ROOT
      name: ROOT
      type: linux-root-amd64
      typeUUID: 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
      fsType: ext4
      start: 5073MiB
      end: "0"
      mountPoint: /
      mountOptions: defaults
      flags: []

# Additional package repositories for this image
packageRepositories:
  - codename: "noble"
    url: "https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu/noble/noble/20260617-1608_2026_SW_A_REL3_RC02"
    pkey: "https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu/keys/adl-hirsute-public.gpg"
    component: "main non-free multimedia internal"
    priority: 2000
    allowPackages:
    # Intel GPU Runtime
    # Remove these to disable: Intel GPU compute & memory management
      - libigfxcmrt7
      - libigdgmm12

    # Intel VA-API Drivers
    # Remove these to disable: Intel specific hardware video acceleration drivers
      - intel-media-va-driver
      - intel-media-va-driver-non-free

    # VA-API (Video Acceleration API)
    # Remove these to disable: hardware video decode/encode via VA-API
      - libva-dev
      - libva-drm2
      - libva-glx2
      - libva-wayland2
      - libva-x11-2
      - libva2
      - va-driver-all
      - vainfo

    # Intel VPL / oneVPL (Video Processing Library)
    # Remove these to disable: Intel oneVPL hardware video processing pipeline
      - libmfx-gen1.2
      # overaly dependency for libvpl-dev
      - libvpl2

    # Mesa Vulkan Drivers
    # Remove these to disable: Vulkan GPU rendering
      - mesa-vulkan-drivers


    # System / Firmware
    # Remove these to disable: Linux firmware blobs
      - linux-firmware # must

    # XDP / eBPF High-Speed Networking
    # Remove these to disable: XDP express data path networking
      - xdp-tools
      - libxdp-dev
      - libxdp1
      - iproute2

    # Intel Management & TEE Stack
    # Remove these to disable: Intel ME, LMS service, TEE access
      - rpc-go
      - lms
      - metee

    # Intel Kernel & Tools
    # Remove these to disable: Intel-optimized 6.18 kernel with headers and tools
      - linux-headers-6.18-intel # must
      - linux-image-6.18-intel # must
      #- linux-kbuild
      #- linux-misc-tools
      #- linux-cpupower
      #- linux-config-6.18
      #- linux-bpf-dev
      - linux-bpftool-6.18-intel
      - linux-intel-pstate-tracer-6.18-intel
      - linux-perf-6.18-intel
      - linux-power-tools-6.18-intel
      - linux-rtla-6.18-intel
      - linux-usbip-6.18-intel
      #- libcpupower-dev
      #- libcpupower1
    
    # Wayland Libraries (overlay version 1.23.0 required by mesa-vulkan-drivers)
    # Remove these to disable: Wayland display protocol libraries
      - libwayland-client0
      - libwayland-server0
      - libwayland-cursor0
      - libwayland-dev
      - libwayland-egl1
      - libwayland-egl-backend-dev
      - libwayland-bin
      - libwayland-doc
      - wayland-protocols

    # GStreamer Multimedia Framework (overlay builds)
    # Remove these to disable: GStreamer pipeline, plugins, RTSP server
      - libgstreamer1.0-0
      - gstreamer1.0-tools
      - gstreamer1.0-plugins-bad
      - gstreamer1.0-plugins-base
      # pin point to internal repository for gstreamer1.0-plugins-good , cant remove requried by bad and pulseaudio plguins
      - gstreamer1.0-plugins-good 
      - gstreamer1.0-pulseaudio
      - libgstreamer1.0-dev
      - libgstreamer-gl1.0-0
      - libgstreamer-plugins-bad1.0-0
      - libgstreamer-plugins-base1.0-0
      - gir1.2-gst-plugins-bad-1.0
      - gir1.2-gstreamer-1.0


    # FFmpeg (overlay build) and its libraries
    # Remove these to disable: multimedia encoding/decoding/streaming
      - ffmpeg
      - libavcodec62
      - libavdevice62
      - libavfilter11
      - libavformat62
      - libavutil60
      - libswresample6
      - libswscale9

     # - intel-lpmd

    # QEMU Virtualization (overlay builds)
    # Remove these to disable: QEMU/KVM virtual machine emulation




    # LinuxPTP (Precision Time Protocol)
    # Remove these to disable: IEEE 1588 PTP clock synchronization
      - linuxptp    

    # comment out the following packages to disable X11 and Wayland display servers, nested X, Weston compositor, and Mutter window manager. These are only needed for overlay builds that require a graphical display server.
    # X Server / Display (overlay builds)
    # Remove these to disable: X11 display server and nested X
    # - xserver-common
    # - xserver-xorg-core
    #  - xserver-xorg-dev
    #  - xnest
    #  - xvfb

    # Weston Compositor (overlay build)
    # Remove these to disable: Weston Wayland reference compositor
    #  - weston
    #  - libweston-10-0

    # Mutter Window Manager (overlay builds)
    # Remove these to disable: GNOME Mutter compositor
    #  - gir1.2-mutter-14
    #  - libmutter-14-0
    #  - mutter-common-bin
    #  - mutter-common



  # ----- OpenVINO -----
  - codename: "ubuntu24"
    url: "https://apt.repos.intel.com/openvino/2025"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
  # ----- Intel oneAPI (oneDNN / Base Toolkit) -----
  - codename: "all"
    url: "https://apt.repos.intel.com/oneapi"
    pkey: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB"
    component: "main"
    priority: 500

  # Docker CE official repository
  - codename: "noble"
    url: "https://download.docker.com/linux/ubuntu"
    pkey: "https://download.docker.com/linux/ubuntu/gpg"
    component: "stable"
    priority: 500


  # ----- Intel RealSense SDK -----
  # ref: https://docs.ros.org/en/iron/p/librealsense2/user_docs/distribution_linux.html
  # TODO: the key ID below is hardcoded; need to find a better way to handle dynamic key discovery
  #       in the packageRepositories section (ICT does not support shell substitution here).
  # To get the current key ID if the build fails with NO_PUBKEY, run:
  #   curl -sSf "https://librealsense.intel.com/Debian/apt-repo/dists/$(lsb_release -cs)/InRelease" \
  #     | gpg --status-fd 1 --verify 2>/dev/null | grep "NO_PUBKEY" | awk '{print $3}'
  # Then update the key ID in the pkey URL below.
  - codename: "noble"
    url: "https://librealsense.intel.com/Debian/apt-repo"
    pkey: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xFB0B24895113F120"
    component: "main"
    priority: 500
    allowPackages:
    # Intel RealSense SDK
    # Remove these to disable: RealSense depth camera runtime and tools
      - librealsense2          # Core SDK runtime library
      - librealsense2-utils    # CLI tools: rs-enumerate-devices, rs-depth, rs-color, rs-fw-update
      - librealsense2-dev      # SDK headers (needed to build custom RealSense apps)
      - librealsense2-dkms
      - librealsense2-gl

  # ----- Mozilla Team PPA (Firefox .deb, avoids Ubuntu's snap-transitional package) -----
  - codename: "noble"
    url: "https://ppa.launchpadcontent.net/mozillateam/ppa/ubuntu"      
    pkey: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0AB215679C571D1C8325275B9BDB3D89CE49EC21"
    component: "main"
    priority: 1001

  # Intel ECI repository (aligned with eci.intel.com setup instructions)
  # apt equivalent: deb [signed-by=...] https://eci.intel.com/repos/noble isar main
  # NOTE: [trusted=yes] workaround — the GPG key and Release signature are valid
  # (verified externally with gpg), but ICT's Go openpgp library fails to verify
  # this particular binary key format. Revert to the pkey URL once ICT is fixed:
  #   pkey: "https://eci.intel.com/repos/gpg-keys/GPG-PUB-KEY-INTEL-ECI.gpg"
  - codename: "isar"
    url: "https://eci.intel.com/repos/noble"
    pkey: "[trusted=yes]"
    component: "main"
    priority: 600
    allowPackages:
      - libcamhal-ipu75xa0
      - libcamhal-ipu75xa
      - libcamera-tools
      - libcamhal-common
      - libcamhal0
      # camera HAL dependency tree (ipu75xa imaging algorithm libs)
      #- libcamhal*
      - libia-*-ipu75xa0
      # GStreamer icamerasrc plugin (Recommends of libcamhal0, not auto-pulled)
      - gstreamer1.0-icamera
      - libgsticamerainterface-1.0-1


systemConfig:
  name: minimal-ubuntu-server
  description: Ubuntu 24.04 server image with Intel packages from Ubuntu archive and overlay
  hostname: minimal-server-ubuntu
  immutability:
    enabled: false

  bootloader:
    bootType: efi
    provider: grub

  packages:
    # Core System
    # Remove these to disable: essential system binaries, shell, coreutils
      - base-files # must
      - bash # must
      - bsdutils # must
      - coreutils # must
      - dash # must
      - debianutils # must
      - diffutils # must
      - findutils # must
      - grep # must
      - gzip # must
      - hostname # must
      - init # must
      - login # must
      - mawk # must
      - ncurses-base # must
      - ncurses-bin # must
      - sed # must
      - systemd # must
      - util-linux # must
      - libattr1


    # Ubuntu Meta-packages
    # Remove these to disable: Ubuntu server essentials meta-package
      - ubuntu-server-minimal # must

    # Kernel
    # Remove these to disable: generic Ubuntu kernel, firmware, initramfs
      - linux-firmware # must
      - linux-base # must
      - initramfs-tools # must

    # Bootloader (EFI / GRUB)
    # Remove these to disable: EFI boot, GRUB bootloader, Secure Boot shim
      - grub-efi-amd64 # must
      - grub-efi-amd64-signed # must
      - grub-efi-amd64-bin # must
      - grub-pc-bin
      - grub2-common # must
      - shim-signed # must
      - efibootmgr # must

    # Networking
    # Remove these to disable: IP configuration, DNS, firewall, download tools
      - iproute2 # must
      - isc-dhcp-client # must
      - iputils-ping
      - netplan.io # must
      - network-manager
      - libbluetooth3
      - networkd-dispatcher
      - systemd-resolved # must
      - net-tools
      - ethtool
      - curl
      - wget
      - ca-certificates # must
      - dns-root-data
      - dnsutils
      - ufw
      - bridge-utils # required, libvirt creates virbr0 bridge for virtual networks
      - dnsmasq-base # required, libvirt uses dnsmasq for DHCP/DNS on virtual networks
      - wireless-regdb # optional, WiFi regulatory compliance database

    # SSH
    # Remove these to disable: remote SSH access
      - openssh-server # must

    # mDNS / Service Discovery
    # Remove these to disable: mDNS hostname.local discovery via Avahi
      - avahi-daemon # required for mDNS hostname.local discovery (BSP feature)
      - avahi-utils
      - libavahi-client3
      - libavahi-common-data
      - libavahi-common3
      - libavahi-core7
      - libavahi-glib1
      - libnss-mdns # required, NSS module enabling .local hostname resolution via Avahi

    # Intel RealSense Camera
    # Requires: Intel RealSense repository (packageRepositories section above)
    # Hardware: USB3 connection; udev rules auto-installed by librealsense2 postinst
    # Verify: rs-enumerate-devices
      - librealsense2          # Core SDK runtime
      - librealsense2-utils    # CLI tools (rs-enumerate-devices, rs-depth, rs-color)
      - librealsense2-dev      # SDK headers for custom application development
      - librealsense2-dkms
      - librealsense2-gl
      - dkms
    # Libcamera Framework
    # Remove these to disable: libcamera support for CSI / USB cameras (V4L2 pipeline)
    # Provides: cam utility (camera enumeration + capture), GStreamer libcamerasrc element
    # Verify: cam --list (lists detected cameras)
    # Note: libcamera-apps (libcamera-hello) is RPi-specific; cam from libcamera-tools
    #       is the standard cross-platform tool available in Ubuntu 24.04 repos
      # libcamera0t64 not listed: pulled automatically as dependency of libcamera-tools
      - libcamera-tools        # 'cam' utility: enumerate and capture from libcamera devices
      - gstreamer1.0-libcamera # GStreamer libcamerasrc element (pipeline integration)

    # Package Management
    # Remove these to disable: APT package manager, GPG verification, PPA support
      - apt # must
      - apt-transport-https
      - apt-utils
      - gpgv # must
      - gnupg
      - software-properties-common

    # System Services
    # Remove these to disable: time sync, logging, cron, auto-updates, snap, D-Bus
      #- systemd-timesyncd
      - chrony
      - rsyslog
      - cron
      - logrotate
      - unattended-upgrades
      - snapd
      - dbus # must
      - udev # must
      - polkitd

    # Storage and Filesystem
    # Remove these to disable: LVM, RAID, filesystem tools, partitioning
      - lvm2
      - mdadm
      - xfsprogs
      - e2fsprogs # must
      - dosfstools # must
      - parted
      - gdisk
      - mount # must
      - thin-provisioning-tools # optional, LVM thin provisioning (used by Docker devicemapper and libvirt)

    # Cloud and Provisioning
    # Remove these to disable: cloud-init based provisioning
      - cloud-init


    # Security
    # Remove these to disable: AppArmor, OpenSSL
      - apparmor
      - openssl # must


    # Performance and Monitoring
    # Remove these to disable: system performance monitoring tools
      - htop
      #- tmon
      #- sysstat
      #- iotop
      #- dstat

    # Diagnostics and Utilities
    # Remove these to disable: text editor, hardware/network diagnostic tools
      - vim
      - tcpdump
      - nano

      #- less
      #- man-db
      #- lsb-release
      #- pciutils
      #- usbutils
      #- lshw
      #- dmidecode
      #- hdparm
      #- smartmontools
      #- strace
      #- iperf3
      #- traceroute
      #- mtr-tiny
      #- socat
      - pcm
      - sysbench
      - stress-ng
      - fio
      - usb-modeswitch
      - v4l-utils
      - libllvm18
      - libdebuginfod1t64


    # Compression and Archiving
    # Remove these to disable: tar, xz, bzip2, zip archive support
      #- tar
      #- xz-utils
      #- bzip2
      - unzip # optional, extract ZIP archives
      #- zip
      - lzop # optional, LZO compression utility
      - pigz # optional, parallel gzip for faster compression
      - zstd # optional, fast Zstandard compression/decompression
      - xxd # optional, hex dump and reverse utility

    # Language and Locale
    # Remove these to disable: locale and language pack support
      #- locales
      #- language-pack-en

    # Diagnostics and Hardware Tools
    # Remove these to disable: hardware/storage info, sensors, PCI/USB inspection
      - pciutils
      - lsscsi
      - sg3-utils
      - lm-sensors
      - msr-tools
      - i2c-tools
      - util-linux-extra
      - lsb-release
      - cpu-checker # optional, checks KVM/hardware virtualization capability
      - hwdata # optional, hardware identification database (PCI/USB IDs)
      - read-edid # optional, read EDID/MCCS data from display monitors

    # Miscellaneous Server Utilities
    # Remove these to disable: sudo, process tools, revision control, terminal multiplexers
      - sudo # must
      - lsof
      - psmisc
      - at
      - bc
      - file
      - patch
      - rsync
      - screen
      - tmux
      - git
      - git-lfs
      - mc


    # Intel GPU Runtime
    # Remove these to disable: Intel GPU compute & memory management
      - libigfxcmrt7
      - libigdgmm12
      - intel-gpu-tools
      - ocl-icd-libopencl1


    # Mesa Vulkan Drivers
    # Remove these to disable: Vulkan GPU rendering
      - mesa-vulkan-drivers
      - mesa-utils
     

    # VA-API (Video Acceleration API)
    # Remove these to disable: hardware video decode/encode via VA-API
      - libva-dev
      - libva-drm2
      - libva-glx2
      - libva-wayland2
      - libva-x11-2
      - libva2
      - va-driver-all
      - vainfo

    # Intel VA-API Drivers
    # Remove these to disable: Intel specific hardware video acceleration drivers
      - intel-media-va-driver
      - intel-media-va-driver-non-free

    # Intel VPL / oneVPL (Video Processing Library)
    # Remove these to disable: Intel oneVPL hardware video processing pipeline
      - libvpl2
      - libmfx-gen1.2


    # DRM Libraries
    # Remove these to disable: Direct Rendering Manager userspace libraries
      - libdrm-amdgpu1
      - libdrm-common
