    - cmd: "find /tmp/gpu-packages -maxdepth 1 -type f -name '*.deb' | xargs -r dpkg -i; apt-get install -y --fix-broken || true"

    # Install NPU driver for PTL
    # Version: v1.33.0.20260529 (from GitHub releases, public)
    - cmd: "dpkg --purge --force-remove-reinstreq intel-driver-compiler-npu intel-fw-npu intel-level-zero-npu intel-level-zero-npu-dbgsym 2>/dev/null || true"
    - cmd: "mkdir -p /tmp/npu-driver"
    - cmd: "cd /tmp/npu-driver && wget -q https://github.com/intel/linux-npu-driver/releases/download/v1.33.0/linux-npu-driver-v1.33.0.20260529-26625960453-ubuntu2404.tar.gz -O /tmp/npu-driver/linux-npu-driver-v1.33.0.20260529-26625960453-ubuntu2404.tar.gz"
    - cmd: "cd /tmp/npu-driver && tar -xf linux-npu-driver-v1.33.0.20260529-26625960453-ubuntu2404.tar.gz"
    - cmd: "find /tmp/npu-driver -name '*.deb' -print0 | xargs -0 dpkg -i"

