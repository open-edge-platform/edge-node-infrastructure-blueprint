    # --- PTL audio enablement (Intel SOF / I2S + HDMI-in codec) ---
    # Step 1: Blacklist legacy HD-audio modules so the DSP/SOF stack is used
    - cmd: "printf 'blacklist snd_hda_intel\nblacklist snd_hda_core\n' > /etc/modprobe.d/blacklist_hda.conf"
    # Step 2: ALSA/SOF options for the I2S audio codec
    - cmd: "printf 'options snd_sof_intel_hda_common sof_use_tplg_nhlt=1\noptions snd_intel_dspcfg dsp_driver=3\n' > /etc/modprobe.d/alsa.conf"
    # Step 3: SOF firmware (signed) for PTL
    - cmd: "mkdir -p /lib/firmware/intel/sof-ipc4/ptl"
    - cmd: "wget -O /lib/firmware/intel/sof-ipc4/ptl/sof-ptl-openmodules.ri https://raw.githubusercontent.com/thesofproject/sof-bin/main/v2.13.x/sof-ipc4-v2.13/ptl/intel-signed/sof-ptl-openmodules.ri --no-check-certificate 2>&1 || echo 'Warning: sof-ptl-openmodules.ri download failed'"
    - cmd: "wget -O /lib/firmware/intel/sof-ipc4/ptl/sof-ptl.ri https://raw.githubusercontent.com/thesofproject/sof-bin/main/v2.13.x/sof-ipc4-v2.13/ptl/intel-signed/sof-ptl.ri --no-check-certificate 2>&1 || echo 'Warning: sof-ptl.ri download failed'"
    # Step 4: SOF topology files. Both are fetched; the kernel loads the one
    #         matching the detected codec. Drop whichever you don't need.
    - cmd: "mkdir -p /lib/firmware/intel/sof-ace-tplg"
    # SoundWire codec (ALC722-CG / rt722)
    - cmd: "wget -O /lib/firmware/intel/sof-ace-tplg/sof-ptl-rt722.tplg https://raw.githubusercontent.com/thesofproject/sof-bin/main/v2.13.x/sof-ipc4-tplg-v2.13/sof-ptl-rt722.tplg --no-check-certificate 2>&1 || echo 'Warning: sof-ptl-rt722.tplg download failed'"
    # HD audio codec via DSP
    - cmd: "wget -O /lib/firmware/intel/sof-ace-tplg/sof-hda-generic.tplg https://raw.githubusercontent.com/thesofproject/sof-bin/main/v2.13.x/sof-ipc4-tplg-v2.13/sof-hda-generic.tplg --no-check-certificate 2>&1 || echo 'Warning: sof-hda-generic.tplg download failed'"

    # --- intel-lpmd v0.1.0 (source build in chroot) ---
    # Build from source because the packaged 0.1.0 deb targets 25.10 (needs libnl
    # >= 3.11, libxml2-16, glibc >= 2.42) while noble has 3.7.0 / libxml2.so.2 / 2.39.
    # Build dependencies are in the packages: list (resolved by ICT with network).
    # Step 1: Download intel-lpmd v0.1.0 source tarball
    - cmd: "mkdir -p /tmp/intel-lpmd && wget -q https://github.com/intel/intel-lpmd/archive/refs/tags/v0.1.0.tar.gz -O /tmp/intel-lpmd/v0.1.0.tar.gz"
    # Step 2: Extract source
    - cmd: "cd /tmp/intel-lpmd && tar -xf v0.1.0.tar.gz"
    # Step 3: Build and install (prefix=/usr so binaries land in /usr/sbin, unit in /usr/lib/systemd/system)
    - cmd: "cd /tmp/intel-lpmd/intel-lpmd-0.1.0 && ./autogen.sh prefix=/usr --localstatedir=/var --sysconfdir=/etc && make -j$(nproc) && make install"
    # Step 4: Verify installation
    - cmd: "test -x /usr/sbin/intel_lpmd && test -f /usr/lib/systemd/system/intel_lpmd.service"
    # Step 5: Enable intel_lpmd service for multi-user target
    - cmd: "mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /usr/lib/systemd/system/intel_lpmd.service /etc/systemd/system/multi-user.target.wants/intel_lpmd.service"
    # Step 6: Clean up source and purge build-only dependencies (no network needed)
    - cmd: "rm -rf /tmp/intel-lpmd && dpkg --purge --force-depends autoconf automake autoconf-archive libtool gtk-doc-tools libdbus-1-dev libxml2-dev libnl-3-dev libnl-genl-3-dev libsystemd-dev libupower-glib-dev 2>/dev/null || true"

    # --- MTL (Meteor Lake) audio firmware – from Intel Artifactory ---
    # Source: af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu-mtl-audio-tplg-6/c0/ TODO remove this for external release, use SOF upstream instead
    - cmd: "mkdir -pv /lib/firmware/intel/sof-ipc4/mtl"
    - cmd: "wget -O /lib/firmware/intel/sof-ipc4/mtl/sof-mtl.ldc https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu-mtl-audio-tplg-6/c0/intel/sof-ipc4/mtl/sof-mtl.ldc 2>&1 || echo 'Warning: sof-mtl.ldc download failed'"
    - cmd: "wget -O /lib/firmware/intel/sof-ipc4/mtl/sof-mtl.ri https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu-mtl-audio-tplg-6/c0/intel/sof-ipc4/mtl/sof-mtl.ri 2>&1 || echo 'Warning: sof-mtl.ri download failed'"
    # MTL topology files
    - cmd: "wget -O /lib/firmware/intel/sof-ace-tplg/sof-mtl-rt711-4ch.tplg https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu-mtl-audio-tplg-6/c0/intel/sof-ace-tplg/sof-mtl-rt711-4ch.tplg 2>&1 || echo 'Warning: sof-mtl-rt711-4ch.tplg download failed'"
    - cmd: "wget -O /lib/firmware/intel/sof-ace-tplg/sof-mtl-rt711.tplg https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu-mtl-audio-tplg-6/c0/intel/sof-ace-tplg/sof-mtl-rt711.tplg 2>&1 || echo 'Warning: sof-mtl-rt711.tplg download failed'"
    - cmd: "wget -O /lib/firmware/intel/sof-ace-tplg/sof-mtl-es83x6-ssp1-hdmi-ssp02.tplg https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu-mtl-audio-tplg-6/c0/intel/sof-ace-tplg/sof-mtl-es83x6-ssp1-hdmi-ssp02.tplg 2>&1 || echo 'Warning: sof-mtl-es83x6-ssp1-hdmi-ssp02.tplg download failed'"
    - cmd: "wget -O /lib/firmware/intel/sof-ace-tplg/sof-mtl-hdmi-ssp02.tplg https://af01p-png.devtools.intel.com/artifactory/hspe-edge-png-local/ubuntu-mtl-audio-tplg-6/c0/intel/sof-ace-tplg/sof-mtl-hdmi-ssp02.tplg 2>&1 || echo 'Warning: sof-mtl-hdmi-ssp02.tplg download failed'"





# ----------------------------------------------------------------------------------
    # Pre-install K3s and Docker CE (both disabled by default)
    # On first boot, cloud-init reads host_type from /etc/cloud/config-file and
    # enables the correct service:
    #   host_type=kubernetes  ? systemctl enable --now k3s + copies kubeconfig
    #   host_type=container   ? systemctl disable k3s, enable --now docker
    # See additionalfiles/ptl/edge-provisioning.cfg for the cloud-init runcmd.
    # ----------------------------------------------------------------------------------

  # --- Kubernetes tools (kubectl / kubelet / kubeadm) ---
  # Pre-install K3s binary and service (network available during build)
    - cmd: "curl -sfL https://get.k3s.io | INSTALL_K3S_SKIP_ENABLE=true INSTALL_K3S_SKIP_START=true INSTALL_K3S_EXEC='server --disable=traefik' sh - 2>&1 || echo Warning: K3s pre-install failed"
        # Ensure both services are disabled by default; cloud-init activates the right one
    - cmd: "systemctl disable k3s 2>/dev/null || true"
    - cmd: "systemctl disable docker 2>/dev/null || true"
    
    # Pre-create docker data-root and daemon config (avoids first-boot delay)
    - cmd: "mkdir -p /opt/docker-data /etc/docker && echo '{\"data-root\": \"/opt/docker-data\"}' > /etc/docker/daemon.json"
    # ----------------------------------------------------------------------------------
    # Remove ICT-generated ubuntu-noble.list — duplicates the Ubuntu 24.04 native
    # ubuntu.sources (DEB822 format)
    # ----------------------------------------------------------------------------------
    - cmd: "rm -f /etc/apt/sources.list.d/ubuntu-noble.list"


    # --- Enable SSH service at boot ---
    # Direct symlink – equivalent to 'systemctl enable ssh' but works in plain chroot
    - cmd: "mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /lib/systemd/system/ssh.service /etc/systemd/system/multi-user.target.wants/ssh.service"

    # --- mDNS: enable Avahi and prevent systemd-resolved from conflicting ---
    # avahi-daemon handles hostname.local resolution; systemd-resolved must not
    # also claim mDNS or the two will conflict on the same multicast address.
    # libnss-mdns postinst adds 'mdns4_minimal' to /etc/nsswitch.conf automatically.
    # Direct symlinks – equivalent to 'systemctl enable avahi-daemon' in plain chroot
    - cmd: "mkdir -p /etc/systemd/system/multi-user.target.wants && ln -sf /lib/systemd/system/avahi-daemon.service /etc/systemd/system/multi-user.target.wants/avahi-daemon.service"
    - cmd: "mkdir -p /etc/systemd/system/sockets.target.wants && ln -sf /lib/systemd/system/avahi-daemon.socket /etc/systemd/system/sockets.target.wants/avahi-daemon.socket"
    - cmd: "mkdir -p /etc/systemd/resolved.conf.d && printf '[Resolve]\nMulticastDNS=no\n' > /etc/systemd/resolved.conf.d/no-mdns.conf"

  
