      - socat
      - open-iscsi
      - libip4tc2
      - libxtables12
      - libmnl0
      - libnfnetlink0
      - libnftnl11
      - nftables
      - libseccomp2
      - libc6
      - libsystemd0

    # Required for provisioning scripts
      - jq


    # Wayland Libraries (overlay version 1.23.0 required by mesa-vulkan-drivers)
