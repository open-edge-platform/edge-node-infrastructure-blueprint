      - qemu-utils
      - libspice-client-glib-2.0-8
      - libspice-client-gtk-3.0-5
      - spice-client-glib-usb-acl-helper
      - spice-client-gtk

     

    # Libvirt Virtualization Management
    # Remove these to disable: libvirt daemon, drivers, and management tools
      - libvirt-sanlock
      - libtpms0
      - libtpms-dev

    # TPM Tools
    # Remove these to disable: TPM2 access broker and command-line tools


    # X Server / Display  SRIOV CBKC test dependency
    # Remove these to disable: X11 display server and nested X
      #- xserver-common
      #- xserver-xorg # for silver test, can be removed
      #- xserver-xorg-core
      #- xserver-xorg-dev
      #- x11-utils # optional, X11 utility programs (xwininfo, xprop, etc.)
      #- x11-xserver-utils # optional, X server utilities (xrandr, xset, xinput, etc.)
      #- xdg-utils # optional, XDG desktop integration utilities (xdg-open, etc.)
