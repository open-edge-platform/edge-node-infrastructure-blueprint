    # cannot be set up and 'dpkg -i' would fail with "depends on libtbb12".
    # We list it here so it's already present before the NPU .deb files are installed.
      - libtbb12 # Threading Building Blocks runtime — required by intel-driver-compiler-npu

    # GStreamer Multimedia Framework
    # Remove these to disable: GStreamer pipeline, plugins, RTSP server
      - libgstreamer1.0-0
