    - cmd: "wget -q https://github.com/intel/intel-graphics-compiler/releases/download/v2.34.4/intel-igc-opencl-2_2.34.4+21428_amd64.deb -O /tmp/gpu-packages/intel-igc-opencl-2_2.34.4+21428_amd64.deb"
    - cmd: "wget -q https://github.com/intel/compute-runtime/releases/download/26.18.38308.1/intel-ocloc_26.18.38308.1-0_amd64.deb -O /tmp/gpu-packages/intel-ocloc_26.18.38308.1-0_amd64.deb"
    - cmd: "wget -q https://github.com/intel/compute-runtime/releases/download/26.18.38308.1/intel-opencl-icd_26.18.38308.1-0_amd64.deb -O /tmp/gpu-packages/intel-opencl-icd_26.18.38308.1-0_amd64.deb"
    - cmd: "wget -q https://github.com/intel/compute-runtime/releases/download/26.18.38308.1/libze-intel-gpu1_26.18.38308.1-0_amd64.deb -O /tmp/gpu-packages/libze-intel-gpu1_26.18.38308.1-0_amd64.deb"
    - cmd: "wget -q https://github.com/oneapi-src/level-zero/releases/download/v1.27.0/level-zero_1.27.0+u24.04_amd64.deb -O /tmp/gpu-packages/level-zero_1.27.0+u24.04_amd64.deb"
