      ##- xcvt # optional, CVTM/GTIF mode line calculator for display resolutions
      #- vdpau-driver-all # optional, VDPAU video decode acceleration driver collection

    # ----------------------------------------------------------------
    # GDM / GNOME Shell — SRIOV CBKC test dependency
    # Required by Setup-SRIOV-CBKC test recipe:
    #   - start_vm.py needs: gdm.service, /etc/gdm3/custom.conf, gnome-shell
    #   - wait_for_gdm_ready() polls for gnome-shell process (180 s timeout)
    #   - xhost + requires an active X display (:0) provided by GDM
    # NOTE: GFXBench GLFW packages below also require GDM/X display; disable both together.
    # TO DISABLE (headless build):
    #   1. Comment out the 3 package lines below
    #   2. Also comment out the 4 GFXBench GLFW package lines in the section below
    #   3. In configurations: switch to multi-user.target and comment out all GDM blocks
    # ----------------------------------------------------------------
    # - gdm3          # GNOME Display Manager: gdm.service + /etc/gdm3/custom.conf
    # - gnome-shell   # GNOME compositor/shell; required by wait_for_gdm_ready() in sriov scripts
