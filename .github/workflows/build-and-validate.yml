---

name: Build Image & VEN Validation

on:
  pull_request:
    branches:
      - main
      - release*
  push:
    branches:
      - main
      - release-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Build image
        run: |
          make build MODE=standard-image skip-proxy=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils net-tools ovmf

      - name: Run VEN validation
        working-directory: infrastructure/build-artifacts/out
        run: |
          tar -xzf usb-installation-files.tar.gz

          # Extract bootable files for VEN
          tar -xzf usb-bootable-files.tar.gz

          # Create virtual disk for installation target
          qemu-img create -f qcow2 ubuntu-disk.img 64G

          echo "Starting VEN (Virtual Edge Node) validation..."
          # Boot the VM with the ISO and validate it launches successfully
          # Use -nographic and a timeout to run headlessly in CI
          timeout 300 qemu-system-x86_64 \
            -m 4G \
            -enable-kvm \
            -cpu host \
            -machine q35,accel=kvm \
            -bios /usr/share/OVMF/OVMF_CODE.fd \
            -nographic \
            -serial mon:stdio \
            -drive file=ubuntu-disk.img,format=qcow2 \
            -cdrom alpine-os.iso \
            -boot d \
            -no-reboot || VEN_EXIT=$?

          # Exit code 124 from timeout means the VM ran for the full duration
          # without crashing - that's a successful boot validation
          if [ "${VEN_EXIT:-0}" -eq 124 ] || [ "${VEN_EXIT:-0}" -eq 0 ]; then
            echo "VEN validation passed - VM booted successfully"
          else
            echo "VEN validation failed with exit code: ${VEN_EXIT}"
            exit 1
          fi
