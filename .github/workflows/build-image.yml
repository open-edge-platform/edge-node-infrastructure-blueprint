---

name: Build Image

on:
  push:
    branches:
      - main
      - release-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ict-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Generate ephemeral build credentials
        run: |
          username="ci-builder"
          password="$(openssl passwd -6 "$(openssl rand -base64 32)")"
          echo "::add-mask::$password"
          echo "USERNAME=$username" >> "$GITHUB_ENV"
          echo "PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Install ICT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd-ukify mmdebstrap

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25'

      - name: Clone and build Image Composer Tool
        run: |
          git clone https://github.com/open-edge-platform/image-composer-tool.git --depth 1 -b main /tmp/image-composer-tool
          cd /tmp/image-composer-tool
          go build -buildmode=pie -ldflags "-s -w" ./cmd/image-composer-tool

      - name: Configure template credentials
        run: |
          template="$GITHUB_WORKSPACE/infrastructure/host-os/ict/generic-handheld-os-template.yml"
          sed -i "s|<USERNAME>|${USERNAME}|; s|<PASSWORD>|${PASSWORD}|" "$template"

      - name: Build ICT image from template
        run: |
          cd /tmp/image-composer-tool
          sudo -E ./image-composer-tool build "$GITHUB_WORKSPACE/infrastructure/host-os/ict/generic-handheld-os-template.yml"

      - name: Copy ICT image and fix permissions
        run: |
          ICT_IMG=$(sudo find /tmp/image-composer-tool/workspace -name "*.raw.gz" -type f | head -1)
          if [ -z "$ICT_IMG" ]; then
            echo "ERROR: ICT image output not found"
            sudo find /tmp/image-composer-tool/workspace -type f -ls
            exit 1
          fi
          echo "Found ICT image: $ICT_IMG"
          sudo cp "$ICT_IMG" "$GITHUB_WORKSPACE/ict-image.raw.gz"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/ict-image.raw.gz"
          ls -lh "$GITHUB_WORKSPACE/ict-image.raw.gz"

      - name: Build final image from ICT output
        run: |
          make build MODE=image-from-tool ICT_IMG="$GITHUB_WORKSPACE/ict-image.raw.gz" skip-proxy=true

  build-script-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Generate ephemeral build credentials
        run: |
          username="ci-builder"
          password="$(openssl passwd -6 "$(openssl rand -base64 32)")"
          echo "::add-mask::$password"
          echo "USERNAME=$username" >> "$GITHUB_ENV"
          echo "PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          make build MODE=standard-image skip-proxy=true
